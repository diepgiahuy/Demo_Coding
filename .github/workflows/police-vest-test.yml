name: Police Full Character Test

on:
  push:
    branches: [police-vest-test]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal Blender runtime
        run: sudo apt-get install -y --no-install-recommends libegl1
      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
      - name: Download proven same-pack Quaternius sources
        run: |
          mkdir -p assets/police_full artifacts/police_full_v4
          curl -fL --retry 3 -o assets/police_full/hoodie_character.glb \
            https://raw.githubusercontent.com/VitexSoftware/ishtaria-client/f50f3ee5b04c1a34f8c30a338db51003aca1b8b0/assets/quaternius/characters/Models/hoodie_character.glb
          curl -fL --retry 3 -o assets/police_full/punk.glb \
            https://raw.githubusercontent.com/VitexSoftware/ishtaria-client/f50f3ee5b04c1a34f8c30a338db51003aca1b8b0/assets/quaternius/characters/Models/punk.glb
          test -s assets/police_full/hoodie_character.glb
          test -s assets/police_full/punk.glb
      - name: Build and render modular police v4
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python police_full_v4.py | tee artifacts/police_full_v4/blender.log
          grep -q POLICE_FULL_V4_PASS artifacts/police_full_v4/blender.log
          test -s artifacts/police_full_v4/Police_Officer_Modular.blend
          test -s artifacts/police_full_v4/qc_report.json
          test "$(find artifacts/police_full_v4/frames -name 'frame_*.png' | wc -l)" -ge 50
      - name: Verify report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/police_full_v4/qc_report.json').read_text())
          assert r['fps']==60, r
          assert r['punk_legs_vertex_group_matches'] >= 4, r
          assert r['punk_feet_vertex_group_matches'] >= 4, r
          assert r['gear_count'] >= 12, r
          assert r['modular_part_motion'] > .02 and r['gear_motion'] > .003, r
          assert r['no_auto_weight'] and r['no_retarget'] and r['no_bone_edit'], r
          print('POLICE_FULL_V4_VERIFY_PASS')
          PY
      - name: Upload modular police proof
        uses: actions/upload-artifact@v4
        with:
          name: police-full-v4
          path: |
            artifacts/police_full_v4/Police_Officer_Modular.blend
            artifacts/police_full_v4/qc_report.json
            artifacts/police_full_v4/blender.log
            artifacts/police_full_v4/frames/*.png
