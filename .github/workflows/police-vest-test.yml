name: Police Full Character Test

on:
  push:
    branches: [police-vest-test]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal Blender runtime
        run: sudo apt-get install -y --no-install-recommends libegl1
      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
      - name: Download proven Punk base
        run: |
          mkdir -p assets/police_full artifacts/police_full_v5
          curl -fL --retry 3 -o assets/police_full/punk.glb \
            https://raw.githubusercontent.com/VitexSoftware/ishtaria-client/f50f3ee5b04c1a34f8c30a338db51003aca1b8b0/assets/quaternius/characters/Models/punk.glb
          test -s assets/police_full/punk.glb
      - name: Build and render Punk-base police v5
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python police_full_v5.py | tee artifacts/police_full_v5/blender.log
          grep -q POLICE_FULL_V5_PASS artifacts/police_full_v5/blender.log
          test -s artifacts/police_full_v5/Police_Officer_Patrol.blend
          test -s artifacts/police_full_v5/qc_report.json
          test "$(find artifacts/police_full_v5/frames -name 'frame_*.png' | wc -l)" -ge 50
      - name: Verify report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/police_full_v5/qc_report.json').read_text())
          assert r['fps']==60, r
          assert r['gear_count'] >= 18, r
          assert r['original_punk_long_pants'] and r['original_weights'], r
          assert r['no_auto_weight'] and r['no_retarget'] and r['no_bone_edit'], r
          assert r['gear_motion'] > .003, r
          print('POLICE_FULL_V5_VERIFY_PASS')
          PY
      - name: Upload Punk-base police proof
        uses: actions/upload-artifact@v4
        with:
          name: police-full-v5
          path: |
            artifacts/police_full_v5/Police_Officer_Patrol.blend
            artifacts/police_full_v5/qc_report.json
            artifacts/police_full_v5/blender.log
            artifacts/police_full_v5/frames/*.png
