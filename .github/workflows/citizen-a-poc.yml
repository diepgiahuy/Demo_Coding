name: Citizen A Blender POC

on:
  push:
    branches: [citizen-a-poc]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-xcb1 libxcb1 libxkbcommon0 ffmpeg

      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.2-linux-x64/blender --version

      - name: Download original CC0 Hoodie Character
        run: |
          mkdir -p assets/citizen_a artifacts/citizen_a
          curl -fL --retry 3 -o assets/citizen_a/hoodie_character.glb \
            https://raw.githubusercontent.com/VitexSoftware/ishtaria-client/f50f3ee5b04c1a34f8c30a338db51003aca1b8b0/assets/quaternius/characters/Models/hoodie_character.glb
          test -s assets/citizen_a/hoodie_character.glb

      - name: Inspect embedded glTF animations
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path('assets/citizen_a/hoodie_character.glb')
          data = p.read_bytes()
          assert data[:4] == b'glTF'
          length = struct.unpack_from('<I', data, 8)[0]
          assert length == len(data)
          offset = 12
          doc = None
          while offset < len(data):
              chunk_len, chunk_type = struct.unpack_from('<II', data, offset)
              offset += 8
              chunk = data[offset:offset+chunk_len]
              offset += chunk_len
              if chunk_type == 0x4E4F534A:
                  doc = json.loads(chunk.decode('utf-8').rstrip('\x00 '))
                  break
          assert doc is not None
          names = [a.get('name','') for a in doc.get('animations', [])]
          print('Embedded animations:', names)
          assert any('walk' in n.lower() for n in names), names
          assert doc.get('skins'), 'No skin found'
          print('GLB_STRUCTURE_PASS')
          PY

      - name: Build and render Citizen A
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python citizen_a_poc.py | tee artifacts/citizen_a/blender.log
          grep -q CITIZEN_A_POC_PASS artifacts/citizen_a/blender.log
          test -s artifacts/citizen_a/Citizen_A.blend
          test -s artifacts/citizen_a/qc_report.json
          test "$(find artifacts/citizen_a/frames -name 'frame_*.png' | wc -l)" -ge 45

      - name: Encode preview video
        run: |
          ffmpeg -y -framerate 30 -pattern_type glob \
            -i 'artifacts/citizen_a/frames/frame_*.png' \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart \
            artifacts/citizen_a/Citizen_A_walk.mp4
          test -s artifacts/citizen_a/Citizen_A_walk.mp4

      - name: Verify outputs
        run: |
          ffprobe -v error \
            -show_entries stream=width,height,nb_frames,r_frame_rate \
            -show_entries format=duration,size \
            -of json artifacts/citizen_a/Citizen_A_walk.mp4 \
            > artifacts/citizen_a/ffprobe.json

          mkdir -p artifacts/citizen_a/check_frames
          ffmpeg -y -i artifacts/citizen_a/Citizen_A_walk.mp4 \
            -vf "select='eq(n,0)+eq(n,15)+eq(n,30)+eq(n,45)'" \
            -vsync 0 artifacts/citizen_a/check_frames/frame_%02d.png

          ffmpeg -y -i artifacts/citizen_a/Citizen_A_walk.mp4 \
            -vf "fps=1,scale=320:-1,tile=4x1" -frames:v 1 \
            artifacts/citizen_a/contact_sheet.png

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/citizen_a/qc_report.json').read_text())
          probe = json.loads(Path('artifacts/citizen_a/ffprobe.json').read_text())
          stream = probe['streams'][0]

          assert report['blender_version'].startswith('5.2.2'), report
          assert 'walk' in report['walk_action'].lower(), report
          assert report['fps'] == 30, report
          assert report['mesh_objects'] >= 1, report
          assert report['bones'] >= 10, report
          assert int(stream['width']) == 640 and int(stream['height']) == 640, stream
          assert int(stream['nb_frames']) >= 45, stream
          for bone in ['FootL', 'FootR']:
              if bone in report['limb_motion_amplitude']:
                  assert report['limb_motion_amplitude'][bone] > 0.005, report
          frames = sorted(Path('artifacts/citizen_a/check_frames').glob('*.png'))
          assert len(frames) == 4, frames
          assert all(p.stat().st_size > 5000 for p in frames), frames
          assert Path('artifacts/citizen_a/contact_sheet.png').stat().st_size > 10000
          print('CITIZEN_A_VERIFY_PASS')
          PY

      - name: Add source note
        run: |
          cat > artifacts/citizen_a/SOURCE.txt <<'EOF'
          Citizen_A uses the original Quaternius Hoodie Character GLB.
          Source pack: Ultimate Modular Men Pack.
          License: CC0 1.0.
          The model contains its original skeleton, skin weights, and embedded animations.
          The POC selects the original Walk animation and does not generate a new walk cycle.
          EOF

      - name: Upload Citizen A artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizen-a-walk-poc
          path: |
            artifacts/citizen_a/Citizen_A.blend
            artifacts/citizen_a/Citizen_A_walk.mp4
            artifacts/citizen_a/contact_sheet.png
            artifacts/citizen_a/check_frames/*.png
            artifacts/citizen_a/qc_report.json
            artifacts/citizen_a/ffprobe.json
            artifacts/citizen_a/SOURCE.txt
            artifacts/citizen_a/blender.log
