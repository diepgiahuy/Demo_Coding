name: Citizen Pack Blender POC

on:
  push:
    branches: [citizen-pack-poc]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-xcb1 libxcb1 libxkbcommon0 ffmpeg

      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.2-linux-x64/blender --version

      - name: Download five CC0 Quaternius citizens
        run: |
          mkdir -p assets/citizen_pack artifacts/citizen_pack
          BASE=https://raw.githubusercontent.com/VitexSoftware/ishtaria-client/f50f3ee5b04c1a34f8c30a338db51003aca1b8b0/assets/quaternius/characters/Models
          for f in hoodie_character.glb punk.glb animated_woman.glb suit_woman.glb worker_woman.glb; do
            curl -fL --retry 3 -o "assets/citizen_pack/$f" "$BASE/$f"
            test -s "assets/citizen_pack/$f"
          done

      - name: Verify skin and Walk in all source assets
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path

          files = [
              'hoodie_character.glb',
              'punk.glb',
              'animated_woman.glb',
              'suit_woman.glb',
              'worker_woman.glb',
          ]

          for name in files:
              p = Path('assets/citizen_pack') / name
              data = p.read_bytes()
              assert data[:4] == b'glTF', name
              assert struct.unpack_from('<I', data, 8)[0] == len(data), name
              offset = 12
              doc = None
              while offset < len(data):
                  chunk_len, chunk_type = struct.unpack_from('<II', data, offset)
                  offset += 8
                  chunk = data[offset:offset+chunk_len]
                  offset += chunk_len
                  if chunk_type == 0x4E4F534A:
                      doc = json.loads(chunk.decode('utf-8').rstrip('\x00 '))
                      break
              assert doc is not None, name
              animations = [a.get('name', '') for a in doc.get('animations', [])]
              assert any('walk' in a.lower() for a in animations), (name, animations)
              assert doc.get('skins'), name
              print(name, 'PASS', [a for a in animations if 'walk' in a.lower()])
          print('SOURCE_ASSETS_PASS')
          PY

      - name: Build and render five Citizens
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python citizen_pack_poc.py | tee artifacts/citizen_pack/blender.log
          grep -q CITIZEN_PACK_POC_PASS artifacts/citizen_pack/blender.log
          test -s artifacts/citizen_pack/Citizen_Pack_5.blend
          test -s artifacts/citizen_pack/qc_report.json
          test "$(find artifacts/citizen_pack/frames -name 'frame_*.png' | wc -l)" -eq 33

      - name: Encode MP4
        run: |
          ffmpeg -y -framerate 30 -pattern_type glob \
            -i 'artifacts/citizen_pack/frames/frame_*.png' \
            -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -movflags +faststart \
            artifacts/citizen_pack/Citizen_Pack_5_walk.mp4

      - name: Verify video and build contact sheet
        run: |
          ffprobe -v error \
            -show_entries stream=width,height,nb_frames,r_frame_rate \
            -show_entries format=duration,size \
            -of json artifacts/citizen_pack/Citizen_Pack_5_walk.mp4 \
            > artifacts/citizen_pack/ffprobe.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/citizen_pack/qc_report.json').read_text())
          probe = json.loads(Path('artifacts/citizen_pack/ffprobe.json').read_text())
          stream = probe['streams'][0]

          assert report['blender_version'].startswith('5.2.2'), report
          assert len(report['citizens']) == 5, report
          assert report['fps'] == 30, report
          assert int(stream['width']) == 960 and int(stream['height']) == 540, stream
          assert int(stream['nb_frames']) == 33, stream
          for citizen in report['citizens']:
              assert 'walk' in citizen['walk_action'].lower(), citizen
              assert citizen['bones'] >= 10, citizen
              assert citizen['meshes'] >= 1, citizen
          print('CITIZEN_PACK_VERIFY_PASS')
          PY

          ffmpeg -y -i artifacts/citizen_pack/Citizen_Pack_5_walk.mp4 \
            -vf "select='eq(n,0)+eq(n,8)+eq(n,16)+eq(n,24)+eq(n,32)',scale=480:-1,tile=5x1" \
            -frames:v 1 artifacts/citizen_pack/contact_sheet.png

          test -s artifacts/citizen_pack/contact_sheet.png

      - name: Add source note
        run: |
          cat > artifacts/citizen_pack/SOURCE.txt <<'EOF'
          Five Citizen Blender POC.
          Source assets: Quaternius character models from Ultimate Modular Men / related Quaternius character packs.
          License: CC0 1.0.
          Models used: hoodie_character, punk, animated_woman, suit_woman, worker_woman.
          Each source GLB provides its original rig, skin weights, and Walk animation.
          The Blender scene uses the original Walk action for every citizen.
          EOF

      - name: Upload Citizen Pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizen-pack-5-walk
          path: |
            artifacts/citizen_pack/Citizen_Pack_5.blend
            artifacts/citizen_pack/Citizen_Pack_5_walk.mp4
            artifacts/citizen_pack/contact_sheet.png
            artifacts/citizen_pack/qc_report.json
            artifacts/citizen_pack/ffprobe.json
            artifacts/citizen_pack/SOURCE.txt
            artifacts/citizen_pack/blender.log
