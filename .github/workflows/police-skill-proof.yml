name: Police Skill Proof

on:
  push:
    branches: [police-skill-proof]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 ffmpeg
      - name: Download Blender
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
      - name: Download Quaternius SWAT CC0
        run: |
          mkdir -p assets/police_skill artifacts/police_skill
          curl -fL --retry 3 -o assets/police_skill/swat.glb \
            https://raw.githubusercontent.com/AlexTriada/web-game/main/assets/swat.glb
          test -s assets/police_skill/swat.glb
          sha256sum assets/police_skill/swat.glb > artifacts/police_skill/asset_sha256.txt
      - name: Build Blender proof
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python police_skill_proof.py | tee artifacts/police_skill/blender.log
          grep -q POLICE_SKILL_PROOF_PASS artifacts/police_skill/blender.log
          test -s artifacts/police_skill/Police_SWAT_SkillProof.blend
      - name: Encode 60fps preview
        run: |
          ffmpeg -y -framerate 60 -pattern_type glob -i 'artifacts/police_skill/frames/frame_*.png' \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
            artifacts/police_skill/Police_SWAT_walk_60fps.mp4
          ffprobe -v error -show_entries stream=width,height,nb_frames,r_frame_rate -show_entries format=duration,size -of json \
            artifacts/police_skill/Police_SWAT_walk_60fps.mp4 > artifacts/police_skill/ffprobe.json
      - name: Visual QC sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          frames=sorted(Path('artifacts/police_skill/frames').glob('frame_*.png'))
          assert len(frames)>=50, len(frames)
          print('frames',len(frames))
          PY
          ffmpeg -y -i artifacts/police_skill/Police_SWAT_walk_60fps.mp4 \
            -vf "select='eq(n,0)+eq(n,16)+eq(n,32)+eq(n,48)+eq(n,64)',scale=300:-1,tile=5x1" \
            -frames:v 1 artifacts/police_skill/contact_sheet.png
          test -s artifacts/police_skill/contact_sheet.png
      - name: Verify report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/police_skill/qc_report.json').read_text())
          p=json.loads(Path('artifacts/police_skill/ffprobe.json').read_text())
          s=p['streams'][0]
          assert r['fps']==60
          assert 'walk' in r['walk_action'].lower()
          assert r['original_rigged_mesh_count']>=1
          assert r['max_visible_mesh_displacement']>0.03
          assert s['r_frame_rate']=='60/1'
          assert int(s['width'])==720 and int(s['height'])==720
          assert int(s['nb_frames'])>=50
          print('POLICE_VIS_MOTION_VERIFY_PASS')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: police-skill-proof
          path: |
            artifacts/police_skill/Police_SWAT_SkillProof.blend
            artifacts/police_skill/Police_SWAT_walk_60fps.mp4
            artifacts/police_skill/contact_sheet.png
            artifacts/police_skill/qc_report.json
            artifacts/police_skill/ffprobe.json
            artifacts/police_skill/asset_sha256.txt
            artifacts/police_skill/blender.log
