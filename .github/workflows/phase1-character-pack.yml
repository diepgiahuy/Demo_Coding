name: Phase1 Character Asset Pack

on:
  push:
    branches: [phase1-character-pack-v1]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal Blender runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libegl1
      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
      - name: Restore Phase 1 builder
        run: |
          cat > /tmp/builder.b64 <<'EOF'

EOF
          base64 -d /tmp/builder.b64 | gzip -d > phase1_character_pack.py
      - name: Build static character asset pack
        run: |
          mkdir -p artifacts/phase1_character_pack/views
          ./blender-5.2.2-linux-x64/blender --background --python phase1_character_pack.py | tee artifacts/phase1_character_pack/blender.log
          grep -q PHASE1_CHARACTER_PACK_PASS artifacts/phase1_character_pack/blender.log
          test -s artifacts/phase1_character_pack/Phase1_Character_Asset_Pack.blend
          test -s artifacts/phase1_character_pack/asset_manifest.json
          test -s artifacts/phase1_character_pack/views/male_lineup.png
          test -s artifacts/phase1_character_pack/views/female_lineup.png
          test -s artifacts/phase1_character_pack/views/police_lineup.png
          test -s artifacts/phase1_character_pack/views/asset_library.png
      - name: Upload Phase 1 proof
        uses: actions/upload-artifact@v4
        with:
          name: phase1-character-pack-v1
          path: |
            artifacts/phase1_character_pack/Phase1_Character_Asset_Pack.blend
            artifacts/phase1_character_pack/asset_manifest.json
            artifacts/phase1_character_pack/blender.log
            artifacts/phase1_character_pack/views/*.png
