name: Exact Animated Men Women Blender Proof

on:
  push:
    branches: [animated-men-women-proof]
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-xcb1 libxcb1 libxkbcommon0 ffmpeg unzip

      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.2-linux-x64/blender --version

      - name: Download exact Quaternius pack mirror
        run: |
          mkdir -p source_exact_packs/men source_exact_packs/women artifacts/animated_men_women
          curl -fL --retry 3 -o men.zip https://raw.githubusercontent.com/MRPT/mvsim-models/main/AnimatedMenCharacters.zip
          curl -fL --retry 3 -o women.zip https://raw.githubusercontent.com/MRPT/mvsim-models/main/AnimatedWomenCharacters.zip
          unzip -q men.zip -d source_exact_packs/men
          unzip -q women.zip -d source_exact_packs/women

      - name: Verify exact source filenames
        run: |
          for f in \
            source_exact_packs/men/FBX/Male_Casual.fbx \
            source_exact_packs/men/FBX/Male_LongSleeve.fbx \
            source_exact_packs/men/FBX/Male_Shirt.fbx \
            source_exact_packs/men/FBX/Male_Suit.fbx \
            source_exact_packs/women/FBX/Female_Alternative.fbx \
            source_exact_packs/women/FBX/Female_Casual.fbx \
            source_exact_packs/women/FBX/Female_Dress.fbx \
            source_exact_packs/women/FBX/Female_TankTop.fbx; do
            test -s "$f"
            echo "PASS $f $(stat -c%s "$f")"
          done
          find source_exact_packs -type f | sort > artifacts/animated_men_women/source_tree.txt

      - name: Build eight exact Blender proofs
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python animated_men_women_proof.py | tee artifacts/animated_men_women/blender.log
          grep -q ANIMATED_MEN_WOMEN_PROOF_PASS artifacts/animated_men_women/blender.log
          test -s artifacts/animated_men_women/qc_report.json

      - name: Encode eight walk previews
        run: |
          for d in \
            Men_Casual Men_LongSleeve Men_Shirt Men_Suit \
            Women_Alternative Women_Casual Women_Dress Women_TankTop; do
            test -s "artifacts/animated_men_women/$d/$d.blend"
            test "$(find "artifacts/animated_men_women/$d/frames" -name 'frame_*.png' | wc -l)" -eq 33
            ffmpeg -y -framerate 30 -pattern_type glob \
              -i "artifacts/animated_men_women/$d/frames/frame_*.png" \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
              "artifacts/animated_men_women/$d/${d}_walk.mp4"
          done

      - name: Build combined eight-person preview
        run: |
          ffmpeg -y \
            -i artifacts/animated_men_women/Men_Casual/Men_Casual_walk.mp4 \
            -i artifacts/animated_men_women/Men_LongSleeve/Men_LongSleeve_walk.mp4 \
            -i artifacts/animated_men_women/Men_Shirt/Men_Shirt_walk.mp4 \
            -i artifacts/animated_men_women/Men_Suit/Men_Suit_walk.mp4 \
            -i artifacts/animated_men_women/Women_Alternative/Women_Alternative_walk.mp4 \
            -i artifacts/animated_men_women/Women_Casual/Women_Casual_walk.mp4 \
            -i artifacts/animated_men_women/Women_Dress/Women_Dress_walk.mp4 \
            -i artifacts/animated_men_women/Women_TankTop/Women_TankTop_walk.mp4 \
            -filter_complex "[0:v][1:v][2:v][3:v][4:v][5:v][6:v][7:v]xstack=inputs=8:layout=0_0|300_0|600_0|900_0|0_450|300_450|600_450|900_450[v]" \
            -map "[v]" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
            artifacts/animated_men_women/Animated_Men_Women_8_walk.mp4

          ffmpeg -y -i artifacts/animated_men_women/Animated_Men_Women_8_walk.mp4 \
            -vf "select='eq(n,16)'" -frames:v 1 artifacts/animated_men_women/contact_sheet.png

      - name: Verify outputs
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('artifacts/animated_men_women')
          report = json.loads((root/'qc_report.json').read_text())
          assert report['blender_version'].startswith('5.2.2'), report['blender_version']
          assert len(report['characters']) == 8, len(report['characters'])
          assert sum(c['pack'] == 'Men' for c in report['characters']) == 4
          assert sum(c['pack'] == 'Women' for c in report['characters']) == 4
          for c in report['characters']:
              assert 'walk' in c['walk_action'].lower(), c
              assert c['bones'] >= 10, c
              assert c['meshes'] >= 1, c
              assert c['moving_limbs'] >= 2, c
              blend = root/c['name']/f"{c['name']}.blend"
              video = root/c['name']/f"{c['name']}_walk.mp4"
              assert blend.stat().st_size > 100000, blend
              assert video.stat().st_size > 5000, video
          combined = root/'Animated_Men_Women_8_walk.mp4'
          out = subprocess.check_output([
              'ffprobe','-v','error','-select_streams','v:0',
              '-show_entries','stream=width,height,nb_frames','-of','json',str(combined)
          ])
          stream = json.loads(out)['streams'][0]
          assert int(stream['width']) == 1200 and int(stream['height']) == 900, stream
          assert int(stream['nb_frames']) == 33, stream
          assert (root/'contact_sheet.png').stat().st_size > 10000
          print('EXACT_PACK_VERIFY_PASS')
          PY

      - name: Add source note
        run: |
          cat > artifacts/animated_men_women/SOURCE.txt <<'EOF'
          Exact Quaternius February 2019 animated human packs.
          License: CC0 1.0.
          Official Men Drive: https://drive.google.com/drive/folders/17LibivOaUidsQhSkcxP3YYvDr0n7wIwu
          Official Women Drive: https://drive.google.com/drive/folders/1c13R--fMqdR6r2MRlcKKsbPky0__T-yJ
          Mirror used for CI: https://github.com/MRPT/mvsim-models
          Mirror files: AnimatedMenCharacters.zip and AnimatedWomenCharacters.zip.
          The FBX filenames match the official Quaternius Drive folders.
          No generated or substitute character mesh is used.
          EOF

      - name: Upload exact pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: exact-animated-men-women-8-blender-proof
          path: |
            artifacts/animated_men_women/Men_Casual/Men_Casual.blend
            artifacts/animated_men_women/Men_Casual/Men_Casual_walk.mp4
            artifacts/animated_men_women/Men_LongSleeve/Men_LongSleeve.blend
            artifacts/animated_men_women/Men_LongSleeve/Men_LongSleeve_walk.mp4
            artifacts/animated_men_women/Men_Shirt/Men_Shirt.blend
            artifacts/animated_men_women/Men_Shirt/Men_Shirt_walk.mp4
            artifacts/animated_men_women/Men_Suit/Men_Suit.blend
            artifacts/animated_men_women/Men_Suit/Men_Suit_walk.mp4
            artifacts/animated_men_women/Women_Alternative/Women_Alternative.blend
            artifacts/animated_men_women/Women_Alternative/Women_Alternative_walk.mp4
            artifacts/animated_men_women/Women_Casual/Women_Casual.blend
            artifacts/animated_men_women/Women_Casual/Women_Casual_walk.mp4
            artifacts/animated_men_women/Women_Dress/Women_Dress.blend
            artifacts/animated_men_women/Women_Dress/Women_Dress_walk.mp4
            artifacts/animated_men_women/Women_TankTop/Women_TankTop.blend
            artifacts/animated_men_women/Women_TankTop/Women_TankTop_walk.mp4
            artifacts/animated_men_women/Animated_Men_Women_8_walk.mp4
            artifacts/animated_men_women/contact_sheet.png
            artifacts/animated_men_women/qc_report.json
            artifacts/animated_men_women/source_tree.txt
            artifacts/animated_men_women/SOURCE.txt
            artifacts/animated_men_women/blender.log
