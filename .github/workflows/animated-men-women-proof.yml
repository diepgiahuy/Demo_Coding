name: Real Blender City Outbreak POC

on:
  push:
    branches: [city-outbreak-poc]
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-xcb1 libxcb1 libxkbcommon0 ffmpeg unzip

      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.2-linux-x64/blender --version

      - name: Download verified city assets
        run: |
          mkdir -p assets/city_outbreak/city assets/city_outbreak/cars/Textures
          mkdir -p assets/city_outbreak/people/men assets/city_outbreak/people/women
          mkdir -p artifacts/city_outbreak/frames

          BASE_CITY='https://raw.githubusercontent.com/AkiraNim/CLTCrossing/6fe4cd6dcb6fbfa4267d3b9971c0968e0fe375b6/CltCrossingv2/assets/kenney_city-kit-suburban'
          for f in house_type02.glb house_type06.glb house_type12.glb house_type17.glb tree_large.glb tree_small.glb; do
            curl -fL --retry 3 -o "assets/city_outbreak/city/$f" "$BASE_CITY/$f"
          done

          BASE_CAR='https://raw.githubusercontent.com/AkiraNim/CLTCrossing/6fe4cd6dcb6fbfa4267d3b9971c0968e0fe375b6/CltCrossingv2/assets/kenney_car-kit'
          curl -fL --retry 3 -o assets/city_outbreak/cars/sedan.glb "$BASE_CAR/sedan.glb"
          curl -fL --retry 3 -o assets/city_outbreak/cars/police.glb "$BASE_CAR/police.glb"
          curl -fL --retry 3 -o assets/city_outbreak/cars/Textures/colormap.png "$BASE_CAR/Textures/colormap.png"

          curl -fL --retry 3 -o assets/city_outbreak/cars/ambulance.glb \
            https://raw.githubusercontent.com/MMqd/godot-screenspace-projection/main/assets/kenney_car-kit/ambulance.glb

          curl -fL --retry 3 -o men.zip https://raw.githubusercontent.com/MRPT/mvsim-models/main/AnimatedMenCharacters.zip
          curl -fL --retry 3 -o women.zip https://raw.githubusercontent.com/MRPT/mvsim-models/main/AnimatedWomenCharacters.zip
          unzip -q men.zip -d assets/city_outbreak/people/men
          unzip -q women.zip -d assets/city_outbreak/people/women

      - name: Verify source assets
        run: |
          for f in \
            assets/city_outbreak/city/house_type02.glb \
            assets/city_outbreak/city/house_type06.glb \
            assets/city_outbreak/city/house_type12.glb \
            assets/city_outbreak/city/house_type17.glb \
            assets/city_outbreak/city/tree_large.glb \
            assets/city_outbreak/city/tree_small.glb \
            assets/city_outbreak/cars/ambulance.glb \
            assets/city_outbreak/cars/police.glb \
            assets/city_outbreak/cars/sedan.glb \
            assets/city_outbreak/people/men/FBX/Male_Casual.fbx \
            assets/city_outbreak/people/men/FBX/Male_Suit.fbx \
            assets/city_outbreak/people/women/FBX/Female_Casual.fbx \
            assets/city_outbreak/people/women/FBX/Female_Dress.fbx; do
            test -s "$f"
            echo "PASS $f $(stat -c%s "$f")"
          done

      - name: Build and render Blender scene
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python animated_men_women_proof.py \
            | tee artifacts/city_outbreak/blender.log
          grep -q CITY_OUTBREAK_POC_PASS artifacts/city_outbreak/blender.log
          test -s artifacts/city_outbreak/city_outbreak_poc.blend
          test -s artifacts/city_outbreak/qc_report.json
          test "$(find artifacts/city_outbreak/frames -name 'frame_*.png' | wc -l)" -eq 60

      - name: Encode proof video
        run: |
          ffmpeg -y -framerate 30 -pattern_type glob \
            -i 'artifacts/city_outbreak/frames/frame_*.png' \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
            artifacts/city_outbreak/city_outbreak_poc.mp4

          ffmpeg -y -i artifacts/city_outbreak/city_outbreak_poc.mp4 \
            -vf "select='eq(n,0)+eq(n,19)+eq(n,31)+eq(n,45)',scale=480:270,tile=2x2" \
            -frames:v 1 artifacts/city_outbreak/contact_sheet.png

      - name: Verify Blender proof
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('artifacts/city_outbreak')
          report = json.loads((root/'qc_report.json').read_text())
          assert report['blender_version'].startswith('5.2.2'), report['blender_version']
          cats = [a['category'] for a in report['assets']]
          assert cats.count('building') == 4, cats
          assert cats.count('tree') == 6, cats
          assert cats.count('ambulance') == 1, cats
          assert cats.count('police') == 1, cats
          assert cats.count('car') >= 2, cats
          assert cats.count('wreck') == 1, cats
          assert len(report['people']) == 4, report['people']
          assert all(p['bones'] >= 10 for p in report['people'])
          assert all('walk' in p['walk_action'].lower() for p in report['people'])
          assert report['fx']['flames'] == 3, report['fx']
          assert report['fx']['smoke_puffs'] == 11, report['fx']
          assert report['fx']['debris'] == 14, report['fx']
          assert (root/'city_outbreak_poc.blend').stat().st_size > 500000
          assert (root/'city_outbreak_poc.mp4').stat().st_size > 20000
          assert (root/'contact_sheet.png').stat().st_size > 10000
          out = subprocess.check_output([
              'ffprobe','-v','error','-select_streams','v:0',
              '-show_entries','stream=width,height,nb_frames','-of','json',
              str(root/'city_outbreak_poc.mp4')
          ])
          stream = json.loads(out)['streams'][0]
          assert int(stream['width']) == 640 and int(stream['height']) == 360, stream
          assert int(stream['nb_frames']) == 60, stream
          print('CITY_OUTBREAK_VERIFY_PASS')
          PY

      - name: Write source manifest
        run: |
          cat > artifacts/city_outbreak/SOURCE.txt <<'EOF'
          Blender scene proof. No generated image is used as scene content.

          Buildings and trees:
          Kenney City Kit (Suburban), CC0.
          Mirror files: AkiraNim/CLTCrossing at commit 6fe4cd6dcb6fbfa4267d3b9971c0968e0fe375b6.

          Vehicles:
          Kenney Car Kit, CC0.
          Sedan and police mirror: AkiraNim/CLTCrossing.
          Ambulance mirror: MMqd/godot-screenspace-projection.

          People:
          Quaternius Animated Men Pack and Animated Women Pack, CC0.
          CI mirror: MRPT/mvsim-models.

          Fire, smoke, explosion flash, debris, road, sidewalks and road markings:
          Generated as Blender geometry, materials, lights and keyframes inside the .blend scene.
          EOF

      - name: Upload Blender artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-outbreak-real-blender-poc
          path: |
            artifacts/city_outbreak/city_outbreak_poc.blend
            artifacts/city_outbreak/city_outbreak_poc.mp4
            artifacts/city_outbreak/contact_sheet.png
            artifacts/city_outbreak/qc_report.json
            artifacts/city_outbreak/SOURCE.txt
            artifacts/city_outbreak/blender.log
