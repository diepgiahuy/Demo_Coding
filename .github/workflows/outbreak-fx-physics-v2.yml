name: Outbreak FX Physics v2 proof

on:
  push:
    branches: [outbreak-fx-physics-v2]
    paths:
      - .github/workflows/outbreak-fx-physics-v2.yml
  workflow_dispatch:

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and patch exact sources
        run: |
          cat ci_sources/build.part* | base64 -d | gzip -d > build_kit.py
          cat ci_sources/upgrade_py.part* > outbreak_fx_physics_v2.py
          echo '88e7e3d6e93b9398031c02abcb35b46bac115949b4bf3edd79272e28b2520034  build_kit.py' | sha256sum -c -
          echo '128337dadeeafa80f68f45f9d7b94a17a024f8d63e9cd644096ea0f331a082e7  outbreak_fx_physics_v2.py' | sha256sum -c -
          echo 'a86207551fcd845e3dec44184b7124a8a8d1ed76f95eb633c2dbc33831024ee9  refine_vehicles.py' | sha256sum -c -
          python3 -m py_compile build_kit.py refine_vehicles.py outbreak_fx_physics_v2.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('build_kit.py')
          s=p.read_text()
          marker="bpy.ops.wm.save_as_mainfile(filepath=str(OUT/'Outbreak_Asset_Library.blend'))"
          i=s.index(marker)+len(marker)
          p.write_text(s[:i]+"\nprint('KIT_BASE_COMPLETE')\n")

          p=Path('outbreak_fx_physics_v2.py')
          s=p.read_text()
          s=s.replace('scene.render.image_settings.file_format = "FFMPEG"', 'scene.render.image_settings.file_format = "PNG"')
          s=re.sub(r'^\s*scene\.render\.ffmpeg\..*\n', '', s, flags=re.M)
          s=s.replace('scene.render.filepath = str(DEMO_MP4)', 'scene.render.filepath = str(OUT / "render_frames_v2" / "frame_")')
          s=s.replace('    assert DEMO_MP4.exists() and DEMO_MP4.stat().st_size > 20_000\n', '')
          s=s.replace('    scene.world.color = (.035, .045, .06)\n', '    if scene.world is None:\n        scene.world = bpy.data.worlds.new("World_Demo_V2")\n    scene.world.color = (.035, .045, .06)\n')
          s=re.sub(r'    if car_proxy\.animation_data and car_proxy\.animation_data\.action:\n(?:        .*\n){1,5}', '', s)
          s=re.sub(r'    if ball\.animation_data and ball\.animation_data\.action:\n(?:        .*\n){1,5}', '', s)
          p.write_text(s)
          PY
          python3 -m py_compile outbreak_fx_physics_v2.py
          mkdir -p render_frames_v2

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-xcb1 libxcb1 libxkbcommon0 ffmpeg

      - name: Download Blender 5.2.2
        run: |
          curl -fL --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.2-linux-x64/blender --version

      - name: Build exact v1 source library
        run: |
          ./blender-5.2.2-linux-x64/blender --background --factory-startup --python build_kit.py | tee build.log
          grep -q KIT_BASE_COMPLETE build.log
          test -s Outbreak_Asset_Library.blend

      - name: Build and prove v2 physics
        run: |
          ./blender-5.2.2-linux-x64/blender --background --factory-startup --python outbreak_fx_physics_v2.py | tee physics.log
          grep -q OUTBREAK_FX_PHYSICS_V2_PASS physics.log

      - name: Encode proof video
        run: |
          test "$(find render_frames_v2 -name 'frame_*.png' | wc -l)" -eq 84
          ffmpeg -y -framerate 24 -i render_frames_v2/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart Outbreak_Physics_Demo_v2.mp4

      - name: Verify artifacts
        run: |
          test -s Outbreak_Asset_Library_v2.blend
          test -s Outbreak_Physics_Demo_v2.blend
          test -s Outbreak_Physics_Demo_v2.mp4
          test -s fx_physics_qa.json
          test "$(find qa_frames_v2 -name 'frame_*.png' | wc -l)" -eq 4
          ffprobe -v error -show_entries stream=width,height,nb_frames,r_frame_rate -show_entries format=duration,size -of json Outbreak_Physics_Demo_v2.mp4 > fx_physics_ffprobe.json
          python3 - <<'PY'
          import json
          q=json.load(open('fx_physics_qa.json'))
          f=json.load(open('fx_physics_ffprobe.json'))
          s=f['streams'][0]
          assert q['rigid_active'] >= 40, q
          assert q['rigid_passive'] >= 6, q
          assert q['rigid_constraints'] >= 15, q
          assert q['ragdoll_bodies'] >= 12, q
          assert q['breakable_constraints'] >= 4, q
          assert q['fluid_domains'] >= 1, q
          assert q['fluid_flows'] >= 1, q
          assert q['fluid_cache_files'] > 0, q
          assert int(s['width']) == 640 and int(s['height']) == 360, s
          assert int(s['nb_frames']) == 84, s
          assert 3.4 <= float(f['format']['duration']) <= 3.6, f
          print('OUTBREAK_FX_PHYSICS_ARTIFACTS_PASS')
          PY

      - name: Upload v2 proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: outbreak-fx-physics-v2
          path: |
            Outbreak_Asset_Library_v2.blend
            Outbreak_Physics_Demo_v2.blend
            Outbreak_Physics_Demo_v2.mp4
            fx_physics_qa.json
            fx_physics_ffprobe.json
            qa_frames_v2/*.png
            outbreak_fx_physics_v2.py
            build.log
            physics.log
