name: Style Frame Inspection Export

on:
  push:
    branches: [outbreak-style-frame-v1]
    paths:
      - '.github/workflows/styleframe-inspection-export.yml'

jobs:
  export:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Download already-rendered style-frame artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11433380737/zip" \
            -o styleframe.zip
          rm -rf inspect_artifact
          mkdir inspect_artifact
          unzip -q styleframe.zip -d inspect_artifact
          test -s inspect_artifact/STYLEFRAME_1080x1920.png
          test -s inspect_artifact/STYLEFRAME_360x640.png
          cp inspect_artifact/STYLEFRAME_1080x1920.png STYLEFRAME_VISUAL_INSPECTION.png
          cp inspect_artifact/STYLEFRAME_360x640.png STYLEFRAME_PHONE_INSPECTION.png

      - name: Commit exact rendered PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STYLEFRAME_VISUAL_INSPECTION.png STYLEFRAME_PHONE_INSPECTION.png
          git commit -m "Add rendered PNGs for visual inspection"
          git push origin HEAD:outbreak-style-frame-v1
